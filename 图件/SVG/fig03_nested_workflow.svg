   <g id="text_3">
    <text style="font-size: 7px; font-family: 'Arial', 'Microsoft YaHei'; fill: #222a30" transform="translate(166.273516 45.74927)">2,584 条班次记录 · 18 个输入 · 170 条危险记录</text>
